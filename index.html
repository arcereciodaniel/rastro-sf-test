<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Rastro Custom · Stylos & Flores</title>
<style>
:root{
  --bg:#f7f7f5;--sidebar:#fbfbfa;--surface:#fff;--surface2:#f4f4f2;--surface3:#ededeb;
  --text:#37352f;--muted:#787774;--border:#e3e2df;--accent:#2d6a4f;--accent2:#40916c;

  --radius:10px;--sidebarW:244px;
}
html[data-theme="dark"]{
  color-scheme:dark;--bg:#191919;--sidebar:#202020;--surface:#252525;--surface2:#2c2c2c;--surface3:#333;
  --text:#f1f1ef;--muted:#a5a5a1;--border:#3b3b3b;--accent:#65ad83;--accent2:#78c49a;
  --accentSoft:#20372c;--good:#6fc190;--warn:#d9a441;--danger:#eb6864;--blue:#7db0dc;--shadow:none;
}

m;font-weight:800;letter-spacing:-.05em;margin-top:8px}.assumption-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}.assumption-row:last-child{border:0}.placeholder{padding:50px 22px;text-align:center;color:var(--muted)}.placeholder h2{color:var(--text);font-size:1.15rem}.mobile-nav{display:none}.mobile-only{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 24px 70px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 18px;border-bottom:1px solid var(--border)}.modal-head h2{margin:0;font-size:1.05rem}.icon-btn{border:0;background:transparent;color:var(--muted);font-size:1.25rem;padding:4px 8px}.modal-body{padding:18px}.amount-wrap{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:16px}.amount-wrap select{width:86px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px}.amount-wrap input{flex:1;min-width:0;border:0;background:transparent;font-size:2.35rem;font-weight:800;letter-spacing:-.05em;outline:0}.field{margin-bottom:13px}.field label{display:block;font-size:.69rem;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px}.field textarea{min-height:70px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:8px}.toast{position:fixed;right:22px;bottom:22px;z-index:120;background:var(--text);color:var(--bg);border-radius:8px;padding:11px 14px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.mobile-menu-btn{display:none}
@media(max-width:1180px){.season-summary{grid-template-columns:repeat(3,1fr)}.mini-kpis{grid-template-columns:repeat(2,1fr)}.event-cards{grid-template-columns:repeat(2,1fr)}.finance-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){:root{--sidebarW:0px}.sidebar{display:none}.main{margin-left:0}.topbar{padding:0 15px;height:58px}.content{padding:20px 15px 92px}.topbar .season-select{display:none}.mobile-menu-btn{display:inline-flex}.hero-grid,.section-grid,.offseason-grid,.budget-grid{grid-template-columns:1fr}.season-summary{grid-template-columns:repeat(2,1fr)}.state-grid{grid-template-columns:1fr}.event-cards{grid-template-columns:1fr 1fr}.mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:color-mix(in srgb,var(--surface) 95%, transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:7px 8px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;padding:4px 8px}.mobile-nav button.active{color:var(--accent);font-weight:750}.mobile-nav .fab{width:48px;height:48px;border-radius:50%;margin-top:-22px;background:var(--accent);color:#fff;font-size:1.4rem;box-shadow:0 6px 18px rgba(0,0,0,.16)}.mobile-only{display:block}}

</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><strong>Rastro</strong><small>Custom · S&F</small></div>
    <div id="businessSidebarMenus">
      <div class="nav-label">Principal</div>
      <nav class="nav" id="desktopNav">
        <button data-view="home" class="active"><span class="ico">⌂</span>Inicio</button>
        <button data-view="season"><span class="ico">◫</span>Temporada</button>
        <button data-view="operation"><span class="ico">▦</span>Operación</button>
        <button data-view="events"><span class="ico">◇</span>Eventos</button>
        <button data-view="movements"><span class="ico">↕</span>Movimientos</button>
        <button data-view="receivables"><span class="ico">$</span>Cobros</button>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <div class="managed-card"><strong>Prototipo V1</strong><span>Base demostrativa para Laura y Stylos &amp; Flores</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <strong class="workspace-mini">Stylos & Flores</strong>
      <div class="spacer"></div>
      <select class="season-select" id="seasonSelect"><option>Temporada 2026/2027</option></select>
      <select class="currency-select" id="currencySelect"><option value="USD">$ USD</option><option value="CRC">₡ CRC</option></select>
      <button class="theme-btn ghost" id="themeBtn">Oscuro</button>
      <button class="primary" id="registerBtn">+ Registrar</button>
    </header>

    <div class="content">
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-season"></section>
      <section class="view" id="view-operation"></section>
      <section class="view" id="view-events"></section>
      <section class="view" id="view-eventDetail"></section>
      <section class="view" id="view-movements"></section>
      <section class="view" id="view-receivables"></section>
    </div>
  </main>

  <nav class="mobile-nav" id="mobileNav">
    <button data-view="home" class="active"><span>⌂</span><span>Inicio</span></button>
    <button data-view="season"><span>◫</span><span>Temporada</span></button>
    <button data-view="operation"><span>▦</span><span>Operación</span></button>
    <button data-view="events"><span>◇</span><span>Eventos</span></button>
    <button class="fab" id="mobileRegister">+</button>
    <button data-view="movements"><span>↕</span><span>Movimientos</span></button>
    <button data-view="receivables"><span>$</span><span>Cobros</span></button>
  </nav>
</div>

<div class="modal" id="registerModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><h2>Registrar gasto</h2><button class="icon-btn" id="closeModal">×</button></div>
    <div class="modal-body">
      <form id="expenseForm">
        <div class="amount-wrap">
          <select id="expenseCurrency"><option value="CRC">CRC ₡</option><option value="USD">USD $</option></select>
          <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0" required autofocus>
        </div>
        <div class="form-grid">
          <div class="field"><label>Categoría</label><select id="expenseCategory"><option>Flores</option><option>Personal</option><option>Hospedaje</option><option>Alimentación</option><option>Gasolina</option><option>Transporte</option><option>Materiales</option><option>Servicios</option><option>Alquiler</option><option>Imprevistos</option><option>Otros</option></select></div>
          <div class="field"><label>Asignación del gasto</label><select id="expenseAssignmentType"><option value="general">Operación general / sin evento</option><option value="single">Un evento</option><option value="multi">Varios eventos</option></select></div>
          <div class="field" id="expenseSingleEventField"><label>Evento relacionado</label><select id="expenseEvent"></select></div>
          <div class="field"><label>Medio de pago</label><select id="expenseMethod"><option>Tarjeta</option><option>Transferencia</option><option>Efectivo</option><option>Otro</option></select></div>
          <div class="field"><label>Fecha</label><input id="expenseDate" type="date" required></div>
        </div>
        <div id="expenseOperationContext" class="card" style="display:none;margin-bottom:13px;padding:12px"></div>
        <div id="expenseMultiAllocation" class="card" style="display:none;margin-bottom:13px;padding:12px">
          <div class="section-title" style="margin-bottom:8px"><div><h2>Distribución entre eventos</h2><div class="kpi-sub">El gasto se registra una sola vez. Aquí defines qué parte corresponde a cada evento.</div></div><button type="button" class="btn secondary small" id="expenseAutoAllocate">Distribuir según presupuesto</button></div>
          <div id="expenseAllocationRows"></div>
          <div id="expenseAllocationSummary" class="kpi-sub" style="margin-top:10px"></div>
        </div>
        <div class="field"><label>Nota <span style="font-weight:400">(opcional)</span></label><textarea id="expenseNote" placeholder="Ej. compra urgente de flores importadas"></textarea></div>
        <div class="modal-actions"><button type="button" class="btn secondary" id="savePending">Guardar para clasificar después</button><button class="btn" type="submit">Guardar gasto</button></div>
      </form>
    </div>

 }else if(assignment==='multi'){
  allocs=$$('.alloc-check').filter(c=>c.checked).map(c=>{const inp=$(`.alloc-amount[data-event="${c.dataset.event}"]`);return {eventId:c.dataset.event,amountOriginal:Number(inp?.value||0)}}).filter(a=>a.amountOriginal>0);
  const totalAllocated=allocs.reduce((s,a)=>s+a.amountOriginal,0);if(!allocs.length){showToast('Asigna un monto a por lo menos un evento.');return}if(totalAllocated>amount+0.01){showToast('La distribución no puede superar el gasto total.');return}
  allocs=allocs.map(a=>({eventId:a.eventId,amountUsd:usd(a.amountOriginal,currency)}));
 }
 const m={id:Date.now(),date:$('#expenseDate').value,category:pending?'Pendiente':$('#expenseCategory').value,description:$('#expenseNote').value||'Gasto registrado',eventId:allocs.length===1?allocs[0].eventId:'',amount,currency,method:$('#expenseMethod').value,status:pending?'Pendiente':'Completo',kind:'expense'};
 movements.push(m);shared.bank-=usd(m.amount,m.currency);
 allocs.forEach(a=>{const budget=budgetForCategory(a.eventId,m.category);expenseAllocations.push({movementId:m.id,eventId:a.eventId,amountUsd:a.amountUsd,operationId:currentExpenseContext.operationId||'',groupId:currentExpenseContext.groupId||'',budgeted:budget>0});const e=eventById(a.eventId);if(e){e.costReal+=a.amountUsd;if(e.costReal>e.costEst*.95&&e.quality==='Alta')e.quality='Media'}});
 closeRegister();showToast(pending?'Guardado para clasificar después':allocs.length>1?'Gasto guardado y distribuido entre eventos':'Gasto guardado');refreshCurrentView()
}
function populateReceivablePending(eventId='', receivableId=''){
 const select=$('#receivablePending');
 const opts=receivables.filter(r=>(!eventId || r.eventId===eventId) && r.status!=='Pagado');
 select.innerHTML=`<option value="">Sin aplicar a cuota específica</option>${opts.map(r=>`<option value="${r.id}" ${r.id===receivableId?'selected':''}>${eventById(r.eventId)?.name} · ${r.concept} · ${moneyUSD(r.amount)}</option>`).join('')}`;
 if(receivableId) select.value=receivableId;
}
function openReceivableModal(eventId='', receivableId=''){
 currentReceivableContext={eventId,receivableId};
 const modal=$('#receivableModal');
 $('#receivableEvent').innerHTML=`<option value="">Elegir después</option>${events.map(e=>`<option value="${e.id}" ${e.id===eventId?'selected':''}>${e.name}</option>`).join('')}`;
 populateReceivablePending(eventId, receivableId);
 if(receivableId){const r=receivables.find(x=>x.id===receivableId);$('#receivableAmount').value=r?.amount||'';$('#receivableCurrency').value='USD';}
 else{$('#receivableAmount').value='';$('#receivableCurrency').value=displayCurrency==='CRC'?'CRC':'USD';}
 $('#receivableMethod').value='Transferencia';
 $('#receivableDate').value=new Date().toISOString().slice(0,10);
 $('#receivableNote').value='';
 modal.classList.add('open');modal.setAttribute('aria-hidden','false');
 setTimeout(()=>$('#receivableAmount').focus(),60);
}
function closeReceivableModal(){$('#receivableModal').classList.remove('open');$('#receivableModal').setAttribute('aria-hidden','true')}
function saveReceivable(markPending=false){
 const amount=Number($('#receivableAmount').value); if(!amount){showToast('Ingresa el monto del cobro.'); return;}
 const eventId=$('#receivableEvent').value || currentReceivableContext.eventId;
 const pendingId=$('#receivablePending').value || currentReceivableContext.receivableId;
 if(!eventId && !markPending){showToast('Selecciona un evento para registrar el cobro.'); return;}
 if(markPending){
   const concept=`Cobro pendiente por confirmar`;
   receivables.push({id:'r'+Date.now(), eventId:eventId||events[0].id, concept, amount, due:$('#receivableDate').value, status:'Pendiente'});
   closeReceivableModal(); showToast('Cobro pendiente guardado'); refreshCurrentView(); return;
 }
 movements.push({id:Date.now(),date:$('#receivableDate').value,category:'Cobro',description:$('#receivableNote').value||'Cobro registrado',eventId,amount,currency:$('#receivableCurrency').value,method:$('#receivableMethod').value,status:'Completo',kind:'income'});
 shared.bank += usd(amount,$('#receivableCurrency').value);
 const e=eventById(eventId); if(e){e.collected += usd(amount,$('#receivableCurrency').value); updateEventFinancialStatus(e)}
 if(pendingId){const r=receivables.find(x=>x.id===pendingId); if(r){r.status='Pagado';}}
 closeReceivableModal(); showToast('Cobro registrado'); refreshCurrentView();
}
function createExpectedReceivable(eventId){
 const e=eventById(eventId); if(!e) return;
 const remaining=Math.max(0, e.sale - e.collected);
 if(!remaining){showToast('Este evento ya no tiene saldo pendiente.'); return;}
 receivables.push({id:'r'+Date.now(), eventId:e.id, concept:'Nueva cuota', amount:remaining, due:new Date().toISOString().slice(0,10), status:'Pendiente'});
 updateEventFinancialStatus(e); showToast('Se agregó una cuota esperada de cobro.'); renderEventDetail();
}
function refreshCurrentView(){
 if(currentView==='eventDetail') renderEventDetail();
 else navTo(currentView);
}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function bindDynamic(){$$('[data-jump]').forEach(el=>el.onclick=()=>navTo(el.dataset.jump));$$('[data-open-event]').forEach(el=>el.onclick=()=>openEvent(el.dataset.openEvent))}

$$('[data-view]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.view)));
$('#registerBtn').onclick=()=>openRegister();
$('#mobileRegister').onclick=()=>openRegister();
$('#closeModal').onclick=closeRegister;
$('#registerModal').addEventListener('click',e=>{if(e.target.id==='registerModal')closeRegister()});
$('#expenseForm').addEventListener('submit',e=>{e.preventDefault();saveExpense(false)});
$('#expenseAssignmentType').onchange=()=>renderExpenseAllocationRows();$('#expenseCategory').onchange=()=>renderExpenseAllocationRows();$('#expenseAmount').oninput=()=>updateAllocationSummary();$('#expenseCurrency').onchange=()=>updateAllocationSummary();$('#expenseAutoAllocate').onclick=()=>autoAllocateExpense();
$('#savePending').onclick=()=>saveExpense(true);
$('#closeReceivableModal').onclick=closeReceivableModal;
$('#receivableModal').addEventListener('click',e=>{if(e.target.id==='receivableModal')closeReceivableModal()});
$('#receivableForm').addEventListener('submit',e=>{e.preventDefault();saveReceivable(false)});
$('#savePendingReceivable').onclick=()=>saveReceivable(true);
$('#receivableEvent').onchange=e=>populateReceivablePending(e.target.value);
$('#currencySelect').onchange=e=>{displayCurrency=e.target.value;if(currentView==='eventDetail')renderEventDetail();else navTo(currentView)};
$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('#themeBtn').textContent=dark?'Oscuro':'Claro';document.querySelector('meta[name="theme-color"]').content=dark?'#f7f7f5':'#191919'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeRegister();closeReceivableModal()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openRegister()}});
renderHome();
</script>
