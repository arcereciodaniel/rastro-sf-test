<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><strong>Rastro</strong><small>Custom · S&F</small></div>
    <div class="workspace-box">
      <div class="workspace-label">Espacio</div>
      <select class="workspace-select" id="workspaceSelect"><option value="business" selected>Stylos & Flores</option><option value="personal">Laura · Personal</option></select>
    </div>
    <div class="nav-label">Principal</div>
    <nav class="nav" id="desktopNav">
      <button data-view="home" class="active"><span class="ico">⌂</span>Inicio</button>
      <button data-view="season"><span class="ico">◫</span>Temporada</button>
      <button data-view="events"><span class="ico">◇</span>Eventos</button>
      <button data-view="movements"><span class="ico">↕</span>Movimientos</button>
      <button data-view="receivables"><span class="ico">$</span>Cobros</button>
    </nav>
    <div class="nav-label">Planificación</div>
    <nav class="nav">
      <button data-view="budget"><span class="ico">▦</span>Presupuesto</button>
      <button data-view="projection"><span class="ico">⌁</span>Proyección</button>
      <button data-view="offseason"><span class="ico">◔</span>Fondo Off Season</button>
    </nav>
    <div class="nav-label">Comercial</div>
    <nav class="nav"><button data-view="quotes"><span class="ico">□</span>Cotizaciones <span class="status blue" style="margin-left:auto">Beta</span></button></nav>
    <div class="nav-label">Análisis</div>
    <nav class="nav"><button data-view="reports"><span class="ico">⌗</span>Reportes</button></nav>
    <div class="nav-label">Administración</div>
    <nav class="nav"><button data-view="accounts"><span class="ico">◉</span>Cuentas</button><button data-view="settings"><span class="ico">⚙</span>Configuración</button></nav>
    <div class="sidebar-bottom">
      <div class="managed-card"><strong>Rastro Managed</strong><span>Propuesta disponible · no activo</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu-btn ghost" id="mobileMore">☰</button>
      <strong class="workspace-mini">Stylos & Flores</strong>
      <div class="spacer"></div>
      <select class="season-select" id="seasonSelect"><option>Temporada 2026/2027</option></select>
      <select class="currency-select" id="currencySelect"><option value="USD">$ USD</option><option value="CRC">₡ CRC</option></select>
      <button class="theme-btn ghost" id="themeBtn">Oscuro</button>
      <button class="primary" id="registerBtn">+ Registrar</button>
    </header>

    <div class="content">
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-season"></section>
      <section class="view" id="view-events"></section>
      <section class="view" id="view-eventDetail"></section>
      <section class="view" id="view-movements"></section>
      <section class="view" id="view-receivables"></section>
      <section class="view" id="view-budget"></section>
      <section class="view" id="view-projection"></section>
      <section class="view" id="view-offseason"></section>
      <section class="view" id="view-quotes"></section>
      <section class="view" id="view-reports"></section>
      <section class="view" id="view-accounts"></section>
      <section class="view" id="view-settings"></section>
      <section class="view" id="view-personal"></section>
    </div>
  </main>

  <nav class="mobile-nav" id="mobileNav">
    <button data-view="home" class="active"><span>⌂</span><span>Inicio</span></button>
    <button data-view="events"><span>◇</span><span>Eventos</span></button>
    <button class="fab" id="mobileRegister">+</button>
    <button data-view="movements"><span>↕</span><span>Movimientos</span></button>
    <button data-view="offseason"><span>◔</span><span>Off Season</span></button>
  </nav>
</div>

<div class="modal" id="registerModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><h2>Registrar gasto</h2><button class="icon-btn" id="closeModal">×</button></div>
    <div class="modal-body">
      <form id="expenseForm">
        <div class="amount-wrap">
          <select id="expenseCurrency"><option value="CRC">CRC ₡</option><option value="USD">USD $</option></select>
          <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0" required autofocus>
        </div>
        <div class="form-grid">
          <div class="field"><label>Categoría</label><select id="expenseCategory"><option>Flores</option><option>Personal</option><option>Gasolina</option><option>Transporte</option><option>Materiales</option><option>Servicios</option><option>Alquiler</option><option>Otros</option></select></div>
          <div class="field"><label>Evento relacionado</label><select id="expenseEvent"></select></div>
          <div class="field"><label>Medio de pago</label><select id="expenseMethod"><option>Tarjeta</option><option>Transferencia</option><option>Efectivo</option><option>Otro</option></select></div>
          <div class="field"><label>Fecha</label><input id="expenseDate" type="date" required></div>
        </div>
        <div class="field"><label>Nota <span style="font-weight:400">(opcional)</span></label><textarea id="expenseNote" placeholder="Ej. compra urgente de flores importadas"></textarea></div>
        <div class="modal-actions"><button type="button" class="btn secondary" id="savePending">Guardar para clasificar después</button><button class="btn" type="submit">Guardar gasto</button></div>
      </form>
    </div>
  </div>
</div>
<div class="toast" id="toast">Movimiento guardado</div>

<script>

function money(v){return displayCurrency==='USD'?moneyUSD(v):moneyCRC(v*FX)}

function renderBudget(){const cats=[['Salarios',18000,17400],['Alquiler',12000,12000],['Servicios',5800,5210],['Vehículos',6200,6880],['Gasolina',4800,5120],['Software',2100,2100],['Administración',5500,4960]];$('#view-budget').innerHTML=header('Presupuesto','Operación empresarial + presupuesto por evento')+`<div class="tabs"><button class="tab active">Operación</button><button class="tab">Eventos</button></div><div class="card table-card"><div class="table-head"><div><strong>Presupuesto operativo · Temporada 2026/2027</strong><div class="kpi-sub">Datos demostrativos</div></div></div><div class="table-wrap"><table><thead><tr><th>Categoría</th><th class="num">Presupuesto</th><th class="num">Real / comprometido</th><th class="num">Diferencia</th></tr></thead><tbody>${cats.map(c=>`<tr><td>${c[0]}</td><td class="num">${money(c[1])}</td><td class="num">${money(c[2])}</td><td class="num ${c[2]>c[1]?'variance plus':'variance minus'}">${money(c[1]-c[2])}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderProjection(){const max=Math.max(...months.map(m=>m.balance));$('#view-projection').innerHTML=header('Proyección de caja','Saldo real + cobros − eventos − operación − reservas')+`<div class="toolbar"><select><option>Temporada</option><option>Mes</option><option>Trimestre</option><option>Semestre</option><option>12 meses</option></select><button class="btn secondary">Escenario base</button></div><div class="card"><div class="section-title"><div><h2>Saldo proyectado</h2><div class="kpi-sub">La temporada completa en una sola lectura</div></div></div><div class="cash-chart" style="height:330px">${months.map(m=>`<div class="bar-wrap"><small>${money(m.balance).replace(/\$|₡/,'')}</small><div class="bar ${m.off?'season-off':''}" style="height:${Math.max(15,m.balance/max*86)}%"></div><label>${m.label}</label></div>`).join('')}</div></div><div class="grid month-detail" style="margin-top:14px">${kpi('Saldo real actual',money(shared.bank))}${kpi('Cobros confirmados',money(shared.seasonContracted-shared.seasonCollected))}${kpi('Costos de eventos',`− ${money(shared.seasonCost)}`)}${kpi('Operación proyectada',`− ${money(shared.operatingSeason)}`)}</div>`}
function renderOffseason(){const p=shared.offReserved/shared.offTarget*100;const remaining=shared.offTarget-shared.offReserved;const contribution=Math.ceil(remaining/8/10)*10;$('#view-offseason').innerHTML=header('Fondo Off Season','Julio — Octubre 2027 · reserva estratégica de operación')+`<div class="grid offseason-grid"><div class="card"><div class="ring"><div class="ring-inner"><strong>${pct(p)}</strong><span>completado</span></div></div><div style="text-align:center"><div class="kpi-value">${money(shared.offReserved)}</div><div class="kpi-sub">de ${money(shared.offTarget)} objetivo</div></div></div><div class="card"><div class="kpi-label">Cobertura actual</div><div class="coverage">0.9 meses</div><div class="kpi-sub">de 4 meses de Off Season</div><div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--border)"><div class="kpi-label">Aporte sugerido</div><div class="kpi-value">${money(contribution)} / mes</div><div class="kpi-sub">Durante los próximos 8 meses para completar el objetivo antes de julio.</div></div></div></div><div class="grid offseason-grid" style="margin-top:14px"><div class="card"><div class="section-title"><h2>Cómo calculamos el objetivo</h2></div>${[['Salarios esenciales',15000],['Alquiler',6500],['Servicios',2800],['Vehículos y mantenimiento',3100],['Software y administración',2100],['Otros esenciales',2500]].map(r=>`<div class="assumption-row"><span>${r[0]}</span><strong>${money(r[1])}</strong></div>`).join('')}<div class="assumption-row" style="font-weight:800"><span>Objetivo estimado</span><strong>${money(shared.offTarget)}</strong></div></div><div class="card"><div class="section-title"><h2>Lectura para Laura</h2></div><p style="font-size:1.05rem;line-height:1.6;margin-top:4px">Con la reserva actual, Stylos & Flores todavía necesita <strong>${money(remaining)}</strong> para cubrir completamente los cuatro meses de Off Season.</p><p class="kpi-sub">Rastro recalcularía esta recomendación cuando cambien el presupuesto, los eventos confirmados o los ingresos conservadores esperados.</p><button class="btn" style="margin-top:12px" data-jump="projection">Ver impacto en proyección</button></div></div>`;bindDynamic()}
function renderQuotes(){const q=[['Smith Celebration','Pacific Weddings',18500,'Aprobada'],['Jones Wedding','Blue Mango Weddings',12700,'En negociación'],['Taylor Wedding','Cliente final',22100,'Enviada']];$('#view-quotes').innerHTML=header('Cotizaciones · Beta','La cotización sigue pudiendo vivir en Word; Rastro captura su dimensión financiera','<button class="btn">+ Registrar cotización</button>')+`<div class="card table-card"><div class="table-wrap"><table><thead><tr><th>Evento</th><th>Planner / cliente</th><th class="num">Total cotizado</th><th>Estado</th><th></th></tr></thead><tbody>${q.map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td class="num">${money(r[2])}</td><td><span class="status ${r[3]==='Aprobada'?'good':'blue'}">${r[3]}</span></td><td><button class="btn secondary small">Ver</button></td></tr>`).join('')}</tbody></table></div></div>`}
function renderReports(){$('#view-reports').innerHTML=header('Reportes','Análisis simple para tomar mejores decisiones')+`<div class="grid event-cards">${[['Rentabilidad por evento','Venta, costo, margen y desviaciones.'],['Resultado de temporada','Contratado, cobrado, costos y resultado estimado.'],['Gastos','Por categoría, mes y evento.'],['Flujo de caja','Real vs. proyectado.'],['Off Season','Cobertura, objetivo y aportes.']].map(r=>`<div class="card"><h3 style="margin:0 0 6px;font-size:.95rem">${r[0]}</h3><div class="kpi-sub">${r[1]}</div><button class="btn secondary small" style="margin-top:12px">Abrir reporte</button></div>`).join('')}</div>`}
function renderAccounts(){$('#view-accounts').innerHTML=header('Cuentas','Representaciones financieras; nunca credenciales bancarias','<button class="btn">+ Cuenta</button>')+`<div class="event-cards">${[['Cuenta operativa USD','USD',24700],['Cuenta operativa CRC','CRC',7100000],['Tarjeta empresarial','USD',0],['Efectivo / caja','CRC',185000]].map(r=>`<div class="card"><div class="kpi-label">${r[0]}</div><div class="kpi-value">${r[1]==='USD'?moneyUSD(r[2]):moneyCRC(r[2])}</div><div class="kpi-sub">${r[1]}</div></div>`).join('')}</div>`}
function renderSettings(){$('#view-settings').innerHTML=header('Configuración','Temporada, categorías, fondos y preferencias')+`<div class="grid section-grid"><div class="card"><h2 style="font-size:1rem;margin-top:0">Empresa</h2><div class="field"><label>Nombre</label><input value="Stylos & Flores"></div><div class="field"><label>Moneda principal</label><select><option>USD</option><option>CRC</option></select></div></div><div class="card"><h2 style="font-size:1rem;margin-top:0">Temporada</h2><div class="form-grid"><div class="field"><label>Inicio</label><select><option>Noviembre</option></select></div><div class="field"><label>Final</label><select><option>Junio</option></select></div><div class="field"><label>Off Season inicia</label><select><option>Julio</option></select></div><div class="field"><label>Off Season finaliza</label><select><option>Octubre</option></select></div></div></div></div>`}
function renderPersonal(){$('#view-personal').innerHTML=header('Laura · Personal','Espacio financiero independiente de Stylos & Flores')+`<div class="card placeholder"><h2>Rastro Personal permanece separado</h2><p>En el producto final este espacio reutilizará el Rastro Core: ingresos, gastos, presupuesto, categorías, fondos y proyección personal.</p><button class="btn" id="backBusiness">Volver a Stylos & Flores</button></div>`;$('#backBusiness').onclick=()=>{$('#workspaceSelect').value='business';navTo('home')}}
function openRegister(eventId=''){const modal=$('#registerModal');$('#expenseEvent').innerHTML=`<option value="">Sin evento / decidir después</option>${events.map(e=>`<option value="${e.id}" ${e.id===eventId?'selected':''}>${e.name}</option>`).join('')}`;$('#expenseDate').value=new Date().toISOString().slice(0,10);$('#expenseAmount').value='';$('#expenseNote').value='';modal.classList.add('open');modal.setAttribute('aria-hidden','false');setTimeout(()=>$('#expenseAmount').focus(),60)}
function closeRegister(){$('#registerModal').classList.remove('open');$('#registerModal').setAttribute('aria-hidden','true')}
function saveExpense(pending=false){const amount=Number($('#expenseAmount').value);if(!amount){showToast('Ingresa un monto.');return}const m={id:Date.now(),date:$('#expenseDate').value,category:pending?'Pendiente':$('#expenseCategory').value,description:$('#expenseNote').value||'Gasto registrado',eventId:pending?'':$('#expenseEvent').value,amount,currency:$('#expenseCurrency').value,method:$('#expenseMethod').value,status:pending?'Pendiente':'Completo'};movements.push(m);if(m.eventId){const e=eventById(m.eventId);e.costReal+=usd(m.amount,m.currency)}closeRegister();showToast(pending?'Guardado para clasificar después':'Gasto guardado');if(currentView==='movements')renderMovements();else if(currentView==='eventDetail')renderEventDetail();else renderHome()}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function bindDynamic(){$$('[data-jump]').forEach(el=>el.onclick=()=>navTo(el.dataset.jump));$$('[data-open-event]').forEach(el=>el.onclick=()=>openEvent(el.dataset.openEvent))}

$$('[data-view]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.view)));
$('#registerBtn').onclick=()=>openRegister();$('#mobileRegister').onclick=()=>openRegister();$('#closeModal').onclick=closeRegister;$('#registerModal').addEventListener('click',e=>{if(e.target.id==='registerModal')closeRegister()});$('#expenseForm').addEventListener('submit',e=>{e.preventDefault();saveExpense(false)});$('#savePending').onclick=()=>saveExpense(true);
$('#currencySelect').onchange=e=>{displayCurrency=e.target.value;if(currentView==='eventDetail')renderEventDetail();else navTo(currentView)};
$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('#themeBtn').textContent=dark?'Oscuro':'Claro';document.querySelector('meta[name="theme-color"]').content=dark?'#f7f7f5':'#191919'};
$('#workspaceSelect').onchange=e=>{if(e.target.value==='personal')navTo('personal');else navTo('home')};$('#mobileMore').onclick=()=>showToast('En móvil, “Más” abrirá Temporada, Cobros, Presupuesto y Configuración.');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRegister();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openRegister()}});
renderHome();
</script>
</body>
</html>
