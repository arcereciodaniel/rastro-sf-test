<html lang="es" data-theme="light">
<head>

<title>Rastro Custom · Stylos & Flores</title>
<style>
:root{
  --bg:#f7f7f5;--sidebar:#fbfbfa;--surface:#fff;--surface2:#f4f4f2;--surface3:#ededeb;

mplate-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:8px}.toast{position:fixed;right:22px;bottom:22px;z-index:120;background:var(--text);color:var(--bg);border-radius:8px;padding:11px 14px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.mobile-menu-btn{display:none}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><strong>Rastro</strong><small>Custom · S&F</small></div>
    <div class="workspace-box">
      <div class="workspace-label">Espacio</div>
      <select class="workspace-select" id="workspaceSelect"><option value="business" selected>Stylos & Flores</option><option value="personal">Laura · Personal</option></select>
    </div>
    <div id="businessSidebarMenus">
      <div class="nav-label">Principal</div>
      <nav class="nav" id="desktopNav">
        <button data-view="home" class="active"><span class="ico">⌂</span>Inicio</button>
        <button data-view="season"><span class="ico">◫</span>Temporada</button>
        <button data-view="events"><span class="ico">◇</span>Eventos</button>
        <button data-view="movements"><span class="ico">↕</span>Movimientos</button>
        <button data-view="receivables"><span class="ico">$</span>Cobros</button>
      </nav>
      <div class="nav-label">Planificación</div>
      <nav class="nav">
        <button data-view="budget"><span class="ico">▦</span>Presupuesto</button>
        <button data-view="projection"><span class="ico">⌁</span>Proyección</button>
        <button data-view="offseason"><span class="ico">◔</span>Fondo Off Season</button>
      </nav>
      <div class="nav-label">Comercial</div>
      <nav class="nav"><button data-view="quotes"><span class="ico">□</span>Cotizaciones <span class="status blue" style="margin-left:auto">Beta</span></button></nav>
      <div class="nav-label">Análisis</div>
      <nav class="nav"><button data-view="reports"><span class="ico">⌗</span>Reportes</button></nav>
      <div class="nav-label">Administración</div>
      <nav class="nav"><button data-view="accounts"><span class="ico">◉</span>Cuentas</button><button data-view="settings"><span class="ico">⚙</span>Configuración</button></nav>
    </div>
    <div id="personalSidebarMenus" style="display:none">
      <div class="nav-label">Personal</div>
      <nav class="nav">
        <button data-personal-section="home" class="active"><span class="ico">⌂</span>Inicio</button>
        <button data-personal-section="movements"><span class="ico">↕</span>Movimientos</button>
        <button data-personal-section="budget"><span class="ico">▦</span>Presupuesto</button>
        <button data-personal-section="projection"><span class="ico">⌁</span>Proyección</button>
        <button data-personal-section="funds"><span class="ico">◔</span>Fondos</button>
      </nav>
      <div class="nav-label">Administración</div>
      <nav class="nav">
        <button data-personal-section="accounts"><span class="ico">◉</span>Cuentas</button>
        <button data-personal-section="settings"><span class="ico">⚙</span>Configuración</button>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <div class="managed-card"><strong>Prototipo V1</strong><span>Base demostrativa para Laura y Stylos &amp; Flores</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu-btn ghost" id="mobileMore">☰</button>
      <strong class="workspace-mini">Stylos & Flores</strong>
      <div class="spacer"></div>
      <select class="season-select" id="seasonSelect"><option>Temporada 2026/2027</option></select>
      <select class="currency-select" id="currencySelect"><option value="USD">$ USD</option><option value="CRC">₡ CRC</option></select>
      <button class="theme-btn ghost" id="themeBtn">Oscuro</button>
      <button class="primary" id="registerBtn">+ Registrar</button>
    </header>

    <div class="content">
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-season"></section>
      <section class="view" id="view-events"></section>
      <section class="view" id="view-eventDetail"></section>
      <section class="view" id="view-movements"></section>
      <section class="view" id="view-receivables"></section>
      <section class="view" id="view-budget"></section>
      <section class="view" id="view-projection"></section>
      <section class="view" id="view-offseason"></section>
      <section class="view" id="view-quotes"></section>
      <section class="view" id="view-reports"></section>
      <section class="view" id="view-accounts"></section>
      <section class="view" id="view-settings"></section>
      <section class="view" id="view-personal"></section>
    </div>
  </main>

  <nav class="mobile-nav" id="mobileNav">
    <button data-view="home" class="active"><span>⌂</span><span>Inicio</span></button>
    <button data-view="events"><span>◇</span><span>Eventos</span></button>
    <button class="fab" id="mobileRegister">+</button>
    <button data-view="movements"><span>↕</span><span>Movimientos</span></button>
    <button data-view="offseason"><span>◔</span><span>Off Season</span></button>
  </nav>

function scenarioFactor(){return projectionScenario==='conservative'?0.92:projectionScenario==='optimistic'?1.08:1}
function projectionLabel(){return projectionScenario==='conservative'?'Escenario conservador':projectionScenario==='optimistic'?'Escenario optimista':'Escenario base'}
function buildProjectionOptions(filter){
 if(filter==='Mes') return months.map(m=>({value:m.key,label:`${m.label} ${m.key.slice(0,4)}`}));
 if(filter==='Trimestre') return [
  {value:'t1',label:'T1 · Nov–Ene', months:['2026-11','2026-12','2027-01']},
  {value:'t2',label:'T2 · Feb–Abr', months:['2027-02','2027-03','2027-04']},
  {value:'t3',label:'T3 · May–Jul', months:['2027-05','2027-06','2027-07']},
  {value:'t4',label:'T4 · Ago–Oct', months:['2027-08','2027-09','2027-10']}
 ];
 if(filter==='Semestre') return [
  {value:'s1',label:'S1 · Nov–Abr', months:['2026-11','2026-12','2027-01','2027-02','2027-03','2027-04']},
  {value:'s2',label:'S2 · May–Oct', months:['2027-05','2027-06','2027-07','2027-08','2027-09','2027-10']}
 ];
 return [{value:'all',label:filter==='12 meses'?'12 meses':'Temporada completa', months:months.map(m=>m.key)}];
}
function projectionDataset(){
 const options=buildProjectionOptions(projectionFilter);
 if(!options.find(o=>o.value===projectionPeriod)) projectionPeriod=options[0].value;
 const option=options.find(o=>o.value===projectionPeriod) || options[0];
 let selectedMonths=[];
 if(projectionFilter==='Mes'){
   const m=months.find(x=>x.key===projectionPeriod) || months[4];
   selectedMonths=[{...m}];
 } else {
   const keys=option.months || months.map(m=>m.key);
   selectedMonths=months.filter(m=>keys.includes(m.key)).map(m=>({...m}));
 }
 const factor=scenarioFactor();
 return selectedMonths.map(m=>({...m,balance:Math.round(m.balance*factor),income:Math.round(m.income*(projectionScenario==='conservative'?0.95:projectionScenario==='optimistic'?1.05:1)),cost:Math.round(m.cost*(projectionScenario==='conservative'?1.04:projectionScenario==='optimistic'?0.97:1))}));
}
function renderProjection(){
 const options=buildProjectionOptions(projectionFilter);
 if(!options.find(o=>o.value===projectionPeriod)) projectionPeriod=options[0].value;
 const dataset=projectionDataset();
 const max=Math.max(...dataset.map(m=>m.balance));
 const incomeSum=dataset.reduce((s,m)=>s+m.income,0);
 const costSum=dataset.reduce((s,m)=>s+m.cost,0);

 currentReceivableContext={eventId,receivableId};
 const modal=$('#receivableModal');
 $('#receivableEvent').innerHTML=`<option value="">Elegir después</option>${events.map(e=>`<option value="${e.id}" ${e.id===eventId?'selected':''}>${e.name}</option>`).join('')}`;
 populateReceivablePending(eventId, receivableId);
 if(receivableId){const r=receivables.find(x=>x.id===receivableId);$('#receivableAmount').value=r?.amount||'';$('#receivableCurrency').value='USD';}
 else{$('#receivableAmount').value='';$('#receivableCurrency').value=displayCurrency==='CRC'?'CRC':'USD';}
 $('#receivableMethod').value='Transferencia';
 $('#receivableDate').value=new Date().toISOString().slice(0,10);
 $('#receivableNote').value='';
 modal.classList.add('open');modal.setAttribute('aria-hidden','false');
 setTimeout(()=>$('#receivableAmount').focus(),60);
}
function closeReceivableModal(){$('#receivableModal').classList.remove('open');$('#receivableModal').setAttribute('aria-hidden','true')}
function saveReceivable(markPending=false){
 const amount=Number($('#receivableAmount').value); if(!amount){showToast('Ingresa el monto del cobro.'); return;}
 const eventId=$('#receivableEvent').value || currentReceivableContext.eventId;
 const pendingId=$('#receivablePending').value || currentReceivableContext.receivableId;
 if(!eventId && !markPending){showToast('Selecciona un evento para registrar el cobro.'); return;}
 if(markPending){
   const concept=`Cobro pendiente por confirmar`;
   receivables.push({id:'r'+Date.now(), eventId:eventId||events[0].id, concept, amount, due:$('#receivableDate').value, status:'Pendiente'});
   closeReceivableModal(); showToast('Cobro pendiente guardado'); refreshCurrentView(); return;
 }
 movements.push({id:Date.now(),date:$('#receivableDate').value,category:'Cobro',description:$('#receivableNote').value||'Cobro registrado',eventId,amount,currency:$('#receivableCurrency').value,method:$('#receivableMethod').value,status:'Completo',kind:'income'});
 shared.bank += usd(amount,$('#receivableCurrency').value);
 const e=eventById(eventId); if(e){e.collected += usd(amount,$('#receivableCurrency').value); updateEventFinancialStatus(e)}
 if(pendingId){const r=receivables.find(x=>x.id===pendingId); if(r){r.status='Pagado';}}
 closeReceivableModal(); showToast('Cobro registrado'); refreshCurrentView();
}
function createExpectedReceivable(eventId){
 const e=eventById(eventId); if(!e) return;
 const remaining=Math.max(0, e.sale - e.collected);
 if(!remaining){showToast('Este evento ya no tiene saldo pendiente.'); return;}
 receivables.push({id:'r'+Date.now(), eventId:e.id, concept:'Nueva cuota', amount:remaining, due:new Date().toISOString().slice(0,10), status:'Pendiente'});
 updateEventFinancialStatus(e); showToast('Se agregó una cuota esperada de cobro.'); renderEventDetail();
}
function refreshCurrentView(){
 if(currentView==='eventDetail') renderEventDetail();
 else navTo(currentView);
}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function bindDynamic(){$$('[data-jump]').forEach(el=>el.onclick=()=>navTo(el.dataset.jump));$$('[data-open-event]').forEach(el=>el.onclick=()=>openEvent(el.dataset.openEvent))}

$$('[data-view]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.view)));
$('#registerBtn').onclick=()=>{$('#workspaceSelect').value==='personal'?openPersonalMovement():openRegister()};$('#mobileRegister').onclick=()=>{$('#workspaceSelect').value==='personal'?openPersonalMovement():openRegister()};$('#closeModal').onclick=closeRegister;$('#registerModal').addEventListener('click',e=>{if(e.target.id==='registerModal')closeRegister()});$('#expenseForm').addEventListener('submit',e=>{e.preventDefault();saveExpense(false)});$('#savePending').onclick=()=>saveExpense(true);
$('#closeReceivableModal').onclick=closeReceivableModal; $('#receivableModal').addEventListener('click',e=>{if(e.target.id==='receivableModal')closeReceivableModal()}); $('#receivableForm').addEventListener('submit',e=>{e.preventDefault();saveReceivable(false)}); $('#savePendingReceivable').onclick=()=>saveReceivable(true); $('#receivableEvent').onchange=e=>populateReceivablePending(e.target.value);
$('#closePersonalMovementModal').onclick=closePersonalMovement; $('#personalMovementModal').addEventListener('click',e=>{if(e.target.id==='personalMovementModal')closePersonalMovement()}); $('#personalMovementForm').addEventListener('submit',e=>{e.preventDefault();savePersonalMovement()}); $('#personalType').onchange=updatePersonalCategoryOptions;
$('#currencySelect').onchange=e=>{displayCurrency=e.target.value;if(currentView==='eventDetail')renderEventDetail();else navTo(currentView)};
$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('#themeBtn').textContent=dark?'Oscuro':'Claro';document.querySelector('meta[name="theme-color"]').content=dark?'#f7f7f5':'#191919'};
$('#workspaceSelect').onchange=e=>setWorkspace(e.target.value); $$('#personalSidebarMenus [data-personal-section]').forEach(btn=>btn.onclick=()=>{personalSection=btn.dataset.personalSection;renderPersonal()});$('#mobileMore').onclick=()=>showToast('En móvil, “Más” abrirá Temporada, Cobros, Presupuesto y Configuración.');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeRegister();closeReceivableModal();closePersonalMovement()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openRegister()}});
renderHome();
</script>

</body>
